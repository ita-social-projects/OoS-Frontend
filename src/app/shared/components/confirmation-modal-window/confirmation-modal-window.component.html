<div class="flex flex-col box-border justify-center items-center content-center">
  <h2 mat-dialog-title>{{ modalTitle | translate }}</h2>
  <p class="confirmation">
    {{ modalConfirmationText | translate }}
    {{ modalConfirmationProperty && modalConfirmationProperty + '?' }}
  </p>

  <div *ngIf="data.type === modalConfirmationType.rate" class="mt-4">
    <app-stars (ratingSelect)="ratingSelectControl = $event" [modalWindow]="modalWindow"></app-stars>
  </div>
  <mat-dialog-actions class="flex flex-row flex-wrap box-border !justify-center items-center">
    <button
      class="btn"
      mat-button
      cdkFocusInitial
      [disabled]="data.type === modalConfirmationType.rate && !ratingSelectControl?.value"
      [mat-dialog-close]="data.type === modalConfirmationType.rate ? ratingSelectControl?.value : true">
      {{ getConfirmationButtonMessage() | translate }}
    </button>
    <button class="btn-cancel btn" mat-button [mat-dialog-close]="false">
      {{ 'BUTTONS.CANCEL' | translate }}
    </button>
  </mat-dialog-actions>
</div>
