<div class="relative phone-input-wrapper" [class.phone-invalid]="parentControl.invalid && parentControl.touched">
  <ngx-mat-intl-tel-input
    cssClass="phone-number-input"
    [cssClass]="parentControl.invalid && parentControl.touched ? 'ng-invalid' : ''"
    [preferredCountries]="['ua']"
    [enableSearch]="true"
    searchPlaceholder="{{ 'SEARCH_PHONE_COUNTRY' | translate }}"
    [formControl]="parentControl">
  </ngx-mat-intl-tel-input>
</div>
