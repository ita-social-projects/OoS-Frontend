<form class="search-bar">
  <mat-form-field class="input-wrapper !flex !flex-row !items-center !justify-between" appearance="fill">
    <input
      matInput
      type="text"
      class="search-input"
      placeholder="{{ 'ENTER_THE_NAME_OF_THE_GROUP_SCHOOL' | translate }}"
      disableOptionCentering
      autocomplete="off"
      appTrimValue
      [formControl]="searchValueFormControl"
      [matAutocomplete]="autoSearch"
      (keyup.enter)="onValueEnter()" />
    <mat-autocomplete 
      #autoSearch="matAutocomplete"
      hideSingleSelectionIndicator="true"
      class="search-input"
      (optionSelected)="onValueSelect()">
      <mat-option class="dropdown-option option search-dropdown-option" *ngFor="let result of filteredResults" [value]="result">
        <div class="w-[100%] flex justify-between items-center">
          <span class="option-value">{{ result }}</span>
          <mat-icon class="close-icon"(keydown.enter)="onDeletePreviousSearchValue(result, $event)" (click)="onDeletePreviousSearchValue(result, $event)"> close </mat-icon>
        </div>
      </mat-option>
    </mat-autocomplete>
    <mat-icon class="icon" style="transform: rotate(90deg)" (keydown.enter)="onValueEnter()" (click)="onValueEnter()">search</mat-icon>
  </mat-form-field>
</form>
