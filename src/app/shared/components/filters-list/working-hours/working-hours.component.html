<p class="filter-text title">
  {{ 'WORKING_DAYS' | translate }}
</p>
<div class="check-boxes flex flex-col items-start">
  <mat-checkbox color="primary" [formControl]="isStrictWorkdaysControl">
    {{ 'EXACT_MATCH' | translate }}
  </mat-checkbox>
</div>

<div class="wrapper flex flex-col box-border items-stretch justify-between">
  <div class="flex flex-row justify-between">
    <div
      *ngFor="let day of days"
      class="toggle flex flex-row justify-center items-center"
      (click)="onToggleDays(day)"
      [ngClass]="day.selected ? 'toggle-selected' : ''">
      {{ day.value | translate }}
    </div>
  </div>
  <p class="filter-text title">
    {{ 'WORKING_HOURS' | translate }}
  </p>
  <div class="check-boxes flex flex-col justify-start">
    <mat-checkbox color="primary" [formControl]="isAppropriateHoursControl">
      {{ 'EXACT_MATCH' | translate }}
    </mat-checkbox>
  </div>
  <div class="wrapper flex flex-col justify-between">
    <div class="flex flex-col justify-start items-start">
      <ng-container class="flex flex-col">
        <div class="flex flex-row justify-start items-center">
          <p class="filter-text w-[20px]">{{ 'FROM' | translate }}</p>
          <div class="relative">
            <input class="time-input" matInput [formControl]="startTimeFormControl" maxlength="5" autocomplete="off" />
            <mat-icon class="clear-time" (click)="onClearTime(startTimeFormControl)" (keydown.enter)="onClearTime(startTimeFormControl)">
              clear
            </mat-icon>
          </div>
          <button mat-icon-button (click)="timepickerStart.open()"><mat-icon class="datepicker-icon">access_time</mat-icon></button>
        </div>
        <app-validation-hint [validationFormControl]="startTimeFormControl"></app-validation-hint>
      </ng-container>
    </div>

    <div class="flex flex-col justify-start items-start">
      <ng-container class="flex flex-col">
        <div class="flex flex-row justify-start items-center">
          <p class="filter-text w-[20px]">{{ 'TO' | translate }}</p>
          <div class="relative">
            <input class="time-input" matInput [formControl]="endTimeFormControl" maxlength="5" autocomplete="off" />
            <mat-icon class="clear-time" (click)="onClearTime(endTimeFormControl)" (keydown.enter)="onClearTime(endTimeFormControl)">
              clear
            </mat-icon>
          </div>
          <button mat-icon-button (click)="timepickerEnd.open()"><mat-icon class="datepicker-icon">access_time</mat-icon></button>
        </div>
        <app-validation-hint [validationFormControl]="endTimeFormControl"></app-validation-hint>
        <app-validation-hint [validationFormControl]="workingHoursFormGroup" [formLevelValidation]="true"></app-validation-hint>
      </ng-container>
    </div>
  </div>

  <!--  <ngx-mat-timepicker-->
  <!--    #timepickerStart-->
  <!--    [format]="24"-->
  <!--    [defaultTime]="startTimeFormControl.value"-->
  <!--    (timeSet)="onTimeSet($event, startTimeFormControl)"-->
  <!--    [cancelBtnTmpl]="btnCancel"-->
  <!--    [confirmBtnTmpl]="btnConfirm"></ngx-mat-timepicker>-->
  <!--  <ngx-mat-timepicker-->
  <!--    #timepickerEnd-->
  <!--    [format]="24"-->
  <!--    [defaultTime]="endTimeFormControl.value"-->
  <!--    (timeSet)="onTimeSet($event, endTimeFormControl)"-->
  <!--    [cancelBtnTmpl]="btnCancel"-->
  <!--    [confirmBtnTmpl]="btnConfirm">-->
  <!--  </ngx-mat-timepicker>-->

  <ng-template #btnCancel>
    <button mat-raised-button class="btn btn-cancel">
      {{ 'BUTTONS.CANCEL' | translate }}
    </button>
  </ng-template>
  <ng-template #btnConfirm>
    <button class="btn" mat-raised-button>
      {{ 'BUTTONS.ADD' | translate }}
    </button>
  </ng-template>
</div>
