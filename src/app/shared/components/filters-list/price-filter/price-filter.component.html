<p class="filter-text title">
  {{ 'FORMS.LABELS.PRICE' | translate }}
</p>
<div class="wrapper flex flex-col justify-center content-between">
  <div class="checkboxes">
    <mat-checkbox class="checkbox" color="primary" [formControl]="isFreeControl">
      {{ 'FOR_FREE' | translate }}
    </mat-checkbox>
    <mat-checkbox class="checkbox" color="primary" [formControl]="isPaidControl">
      {{ 'PAID' | translate }}
    </mat-checkbox>
  </div>

  <div class="wrapper flex flex-col justify-between" [class.input-wrapper-disable]="!isPaidControl.value">
    <mat-form-field class="price-filter">
      <div class="flex p-0 flex-row w-[150px] items-center">
        <p class="filter-text w-[20px]">
          {{ 'FROM' | translate }}
        </p>
        <input
          matInput
          class="price-input"
          type="number"
          [useArrows]="false"
          appDigitOnly
          appMinMax
          [minValue]="validationConstants.MIN_PRICE"
          [maxValue]="validationConstants.MAX_PRICE"
          [formControl]="minPriceControl"
          autocomplete="off"
          (blur)="onPriceBlur('min')" />
        <mat-icon *ngIf="!minPriceControl.disabled" class="clear-price" (keydown.enter)="clearMin()" (click)="clearMin()">clear</mat-icon>
      </div>
    </mat-form-field>
    <mat-form-field class="price-filter">
      <div class="flex flex-row w-[150px] items-center">
        <p class="filter-text w-[20px]">
          {{ 'TO' | translate }}
        </p>
        <input
          matInput
          class="price-input"
          type="number"
          [useArrows]="false"
          appDigitOnly
          [formControl]="maxPriceControl"
          appMinMax
          [minValue]="validationConstants.MIN_PRICE"
          [maxValue]="validationConstants.MAX_PRICE"
          autocomplete="off"
          (blur)="onPriceBlur('max')" />
        <mat-icon *ngIf="!maxPriceControl.disabled" class="clear-price" (keydown.enter)="clearMax()" (click)="clearMax()">clear</mat-icon>
      </div>
    </mat-form-field>
  </div>
  <div *ngIf="limitMinMaxPrice.isActiveLimitation">
    <app-validation-hint
      [validationFormControl]="minPriceControl"
      [minValue]="limitMinMaxPrice.minPrice"
      [maxValue]="limitMinMaxPrice.maxPrice">
    </app-validation-hint>
    <app-validation-hint
      [validationFormControl]="maxPriceControl"
      [minValue]="limitMinMaxPrice.minPrice"
      [maxValue]="limitMinMaxPrice.maxPrice">
    </app-validation-hint>
  </div>
  <div class="filter-slider flex flex-col justify-between gap-4" [class.input-wrapper-disable]="!isPaidControl.value">
    <ngx-slider (userChange)="priceHandler($event)" [value]="minPriceControl.value" [highValue]="maxPriceControl.value" [options]="options">
    </ngx-slider>
  </div>
  <div [class.input-wrapper-disable]="!isPaidControl.value">
    <p class="filter-text title">
      {{ 'FORMS.LABELS.PAYMENT_UNIT' | translate }}
    </p>
    <mat-form-field class="w-full" appearance="fill">
      <mat-select
        [disableOptionCentering]="true"
        panelClass="dropdown-panel select-with-form-field"
        class="step-input"
        [formControl]="payRateControl"
        placeholder="{{ 'FORMS.PLACEHOLDERS.PAYMENT_TYPE' | translate }}">
        <ng-container *ngFor="let type of PayRateType | keyvalue">
          <mat-option *ngIf="PayRateTypeEnum[type.key]" [value]="type.key" class="dropdown-option">
            {{ PayRateTypeEnum[type.key] | translate }}
          </mat-option>
        </ng-container>
      </mat-select>
    </mat-form-field>
  </div>
</div>
