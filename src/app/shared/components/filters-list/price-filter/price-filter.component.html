<p class="filter-text title">
  {{ 'FORMS.LABELS.PRICE' | translate }}
</p>
<div class="wrapper flex flex-col justify-center content-between">
  <div class="checkboxes">
    <mat-checkbox class="checkbox" color="primary" [formControl]="isFreeControl">
      {{ 'FOR_FREE' | translate }}
    </mat-checkbox>
    <mat-checkbox class="checkbox" color="primary" [formControl]="isPaidControl">
      {{ 'PAID' | translate }}
    </mat-checkbox>
  </div>

  <div class="wrapper flex flex-row justify-between gap-4" [class.input-wrapper-disable]="!isPaidControl.value">
    <mat-form-field class="price-filter">
      <div class="flex p-0 w-[100px] flex-row items-center">
        <p class="filter-text">
          {{ 'FROM' | translate }}
        </p>
        <input matInput class="price-input" type="number" appDigitOnly maxlength="6" [formControl]="minPriceControl" autocomplete="off" />
        <mat-icon class="clear-price" (keydown.enter)="clearMin()" (click)="clearMin()">clear</mat-icon>
      </div>
    </mat-form-field>
    <mat-form-field class="price-filter">
      <div class="flex w-[100px] flex-row items-center">
        <p class="filter-text">
          {{ 'TO' | translate }}
        </p>
        <input matInput class="price-input" type="number" appDigitOnly maxlength="6" [formControl]="maxPriceControl" autocomplete="off" />
        <mat-icon class="clear-price" (keydown.enter)="clearMax()" (click)="clearMax()">clear</mat-icon>
      </div>
    </mat-form-field>
  </div>
  <div *ngIf="limitMinMaxPrice.isActiveLimitation">
    <app-validation-hint
      [validationFormControl]="minPriceControl"
      [minValue]="limitMinMaxPrice.minPrice"
      [maxValue]="limitMinMaxPrice.maxPrice">
    </app-validation-hint>
    <app-validation-hint
      [validationFormControl]="maxPriceControl"
      [minValue]="limitMinMaxPrice.minPrice"
      [maxValue]="limitMinMaxPrice.maxPrice">
    </app-validation-hint>
  </div>
  <div class="filter-slider flex flex-col justify-between gap-4" [class.input-wrapper-disable]="!isPaidControl.value">
    <ngx-slider (userChange)="priceHandler($event)" [value]="minValue" [highValue]="maxValue" [options]="options"> </ngx-slider>
  </div>
  <div>
    <p class="filter-text title">
      {{ 'FORMS.LABELS.PAYMENT_UNIT' | translate }}
    </p>
    <div class="flex flex-nowrap" [class.input-wrapper-disable]="!isPaidControl.value">
      <mat-select
        disableOptionCentering
        panelClass="dropdown-panel"
        class="step-input payment-type-input"
        [formControl]="payRateControl"
        placeholder="{{ 'FORMS.PLACEHOLDERS.PAYMENT_TYPE' | translate }}">
        <ng-container *ngFor="let type of PayRateType | keyvalue">
          <mat-option *ngIf="PayRateTypeEnum[type.key]" [value]="type.key" class="dropdown-option">
            {{ PayRateTypeEnum[type.key] | translate }}
          </mat-option>
        </ng-container>
      </mat-select>
      <mat-icon
        class="clear-pay-rate"
        type="button"
        [class.disabled-pay-rate]="!isPaidControl.value"
        (keydown.enter)="clearPayRate()"
        (click)="clearPayRate()"
        >clear</mat-icon
      >
    </div>
  </div>
</div>
