<p class="filter-text title">
  {{ 'SELECT_AGE' | translate }}
</p>
<div class="check-boxes flex flex-col items-start">
  <mat-checkbox color="primary" [formControl]="isAppropriateAgeControl">
    {{ 'EXACT_MATCH' | translate }}
  </mat-checkbox>
</div>
<div class="wrapper flex flex-row justify-between gap-4">
  <div class="flex flex-col gap-1">
    <div class="from-filter-text flex flex-row items-center">
      <p class="filter-text">
        {{ 'FROM' | translate }}
      </p>
      <div class="relative">
        <input matInput class="age-input" type="number" [formControl]="minAgeFormControl" appDigitOnly autocomplete="off" />
        <mat-icon class="clear-age" (click)="clearMin()" (keydown.enter)="clearMin()">clear</mat-icon>
      </div>
    </div>
    <app-validation-hint
      [validationFormControl]="minAgeFormControl"
      isNumberValue="true"
      [minValue]="validationConstants.AGE_MIN"
      [maxValue]="validationConstants.BIRTH_AGE_MAX"></app-validation-hint>
  </div>
  <div class="flex flex-col gap-1">
    <div class="flex flex-row items-center">
      <p class="filter-text">
        {{ 'TO' | translate }}
      </p>
      <div class="relative">
        <input matInput class="age-input" type="number" [formControl]="maxAgeFormControl" appDigitOnly autocomplete="off" />
        <mat-icon class="clear-age" (click)="clearMax()" (keydown.enter)="clearMax()">clear</mat-icon>
      </div>
    </div>
    <app-validation-hint
      isNumberValue="true"
      [validationFormControl]="maxAgeFormControl"
      [minValue]="validationConstants.AGE_MIN"
      [maxValue]="validationConstants.BIRTH_AGE_MAX"></app-validation-hint>
  </div>
</div>
<app-validation-hint formLevelValidation="true" [validationFormControl]="ageFormGroup"></app-validation-hint>
