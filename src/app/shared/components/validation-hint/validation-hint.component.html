
<small #validationHint [matTooltip]="tooltipText" appValidationMessageStyling>
  <ng-container *ngIf="validationFormControl.touched && validationFormControl.invalid">
    <div *ngFor="let error of errors">
      {{ validationMessageService.getMessage(error, validationParams) }}
    </div>
  </ng-container>
</small>
