<mat-form-field style="margin-left: 1em">
  <mat-select
    disableOptionCentering
    panelClass="dropdown-panel"
    class="select"
    [value]="(filterList$ | async).order"
    (selectionChange)="onSelectOption($event)">
    <mat-option *ngIf="ts.get('BY_RATING') | async" value="{{ Ordering.rating }}" class="dropdown-option">
      {{ 'BY_RATING' | translate }}
    </mat-option>
    <mat-option *ngIf="ts.get('BY_PRICE_INCREASE') | async" value="{{ Ordering.priceAsc }}" class="dropdown-option">
      {{ ('BY_PRICE_INCREASE' | translate) + ' &#8593;' }}
    </mat-option>
    <mat-option *ngIf="ts.get('BY_PRICE_DECREASE') | async" value="{{ Ordering.priceDesc }}" class="dropdown-option">
      {{ ('BY_PRICE_DECREASE' | translate) + ' &#8595;' }}
    </mat-option>
    <mat-option *ngIf="ts.get('BY_ALPHABET') | async" value="{{ Ordering.alphabet }}" class="dropdown-option">
      {{ 'BY_ALPHABET' | translate }}
    </mat-option>
    <mat-option *ngIf="ts.get('NEAREST') | async" value="{{ Ordering.nearest }}" class="dropdown-option">
      {{ 'NEAREST' | translate }}
    </mat-option>
  </mat-select>
</mat-form-field>
