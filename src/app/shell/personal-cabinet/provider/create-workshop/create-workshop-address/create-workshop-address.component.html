<div class="step">
  <div class="accordion-wrapper" class="flex flex-col">
    <mat-accordion>
      <mat-expansion-panel
        *ngFor="let addressForm of addressesFormArray.controls; let item = index"
        class="mat-elevation-z0 accordion-item"
        [expanded]="step === item"
        (opened)="setStep(item)">
        <mat-expansion-panel-header>
          <mat-panel-title class="flex flex-row justify-between">
            <p class="step-label step-title">{{ 'FORMS.LABELS.ADDRESS' | translate }} {{ item + 1 }}</p>
            <button class="delete-block" mat-button (click)="$event.stopPropagation(); deleteAddressForm(item)" *ngIf="item !== 0">
              <mat-icon class="mat-icon-delete">delete</mat-icon>
            </button>
          </mat-panel-title>
        </mat-expansion-panel-header>
        <form [formGroup]="addressForm">
          <div class="flex flex-col address-form">
            <mat-checkbox
              class="step-label"
              color="primary"
              formControlName="isDefault"
              (change)="onIsDefaultChange(addressForm, $event.checked)">
              {{ 'BUTTONS.USE_ADDRESS_AS_PRIMARY' | translate }}
            </mat-checkbox>
            <label class="step-label" for="title">{{ 'FORMS.LABELS.ADDRESS_TITLE' | translate }}<span class="step-required">*</span></label>
            <mat-form-field class="flex items-stretch">
              <input matInput class="step-input" type="text" formControlName="title" autocomplete="none" appTrimValue />
            </mat-form-field>
            <app-validation-hint
              [validationFormControl]="addressForm.get('title')"
              [minCharacters]="3"
              [maxCharacters]="60"></app-validation-hint>
            <app-create-address-form
              [addressFormGroup]="addressForm.get('address')"
              [searchFormGroup]="addressForm.get('searchGroup')"
              [address]="address">
            </app-create-address-form>
            <div formArrayName="phones" class="flex flex-col">
              <label class="step-label">{{ 'FORMS.LABELS.PHONE' | translate }}<span class="step-required">*</span></label>
              <div *ngFor="let phoneField of addressForm.get('phones').controls; let j = index">
                <div class="flex flex-col grow" formGroupName="{{ j }}">
                  <mat-form-field class="grow">
                    <input
                      formControlName="type"
                      matInput
                      class="step-input"
                      type="text"
                      id="phone-{{ j }}"
                      autocomplete="none"
                      appTrimValue />
                  </mat-form-field>
                  <div class="flex flex-row">
                    <app-phone-form-control class="grow" [parentFormControl]="phoneField.get('number')"></app-phone-form-control>
                    <app-validation-hint
                      [validationFormControl]="phoneField.get('number')"
                      [minCharacters]="validationConstants.PHONE_LENGTH"
                      [isPhoneNumber]="true">
                    </app-validation-hint>
                    <button class="delete-block" mat-button (click)="deleteFormField(addressForm.get('phones'), j)" *ngIf="j !== 0">
                      <mat-icon class="mat-icon-delete">delete</mat-icon>
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <div class="flex flex-row justify-start items-center content-center">
              <button class="btn-add" mat-button (click)="addPhoneField(addressForm)" [disabled]="addressForm.get('phones').invalid">
                <mat-icon class="mat-icon-add">add</mat-icon>{{ 'BUTTONS.ADD_MORE_PHONE' | translate }}
              </button>
            </div>

            <div formArrayName="emails" class="flex flex-col">
              <label class="step-label" for="email-{{ j }}">
                {{ 'FORMS.LABELS.EMAIL' | translate }}<span class="step-required">*</span>
              </label>
              <div class="flex" *ngFor="let emailField of addressForm.get('emails').controls; let j = index">
                <div class="flex flex-col grow" formGroupName="{{ j }}">
                  <mat-form-field class="grow">
                    <input
                      formControlName="type"
                      matInput
                      class="step-input"
                      type="text"
                      id="email-{{ j }}"
                      autocomplete="none"
                      appTrimValue />
                  </mat-form-field>
                  <div class="flex flex-row">
                    <mat-form-field class="grow">
                      <input
                        formControlName="address"
                        matInput
                        class="step-input"
                        type="text"
                        id="email-{{ j }}"
                        autocomplete="none"
                        appTrimValue />
                    </mat-form-field>
                    <app-validation-hint [validationFormControl]="emailField.get('address')"></app-validation-hint>

                    <button class="delete-block" mat-button (click)="deleteFormField(addressForm.get('emails'), j)" *ngIf="j !== 0">
                      <mat-icon class="mat-icon-delete">delete</mat-icon>
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <div class="flex flex-row justify-start items-center content-center">
              <button class="btn-add" mat-button (click)="addEmailField(addressForm)" [disabled]="addressForm.get('emails').invalid">
                <mat-icon class="mat-icon-add">add</mat-icon>{{ 'BUTTONS.ADD_MORE_EMAIL' | translate }}
              </button>
            </div>

            <div formArrayName="socialNetworks" class="flex flex-col">
              <label class="step-label" for="email-{{ j }}">
                {{ 'FORMS.LABELS.SOCIAL_NETWORKS' | translate }}
              </label>
              <div class="flex" *ngFor="let socialNetwork of addressForm.get('socialNetworks').controls; let j = index">
                <div class="flex flex-col grow" formGroupName="{{ j }}">
                  <mat-form-field class="grow">
                    <mat-select formControlName="type" class="step-input" disableOptionCentering panelClass="dropdown-panel">
                      <mat-option *ngFor="let socialType of socialTypesKeys()" [value]="socialType">
                        {{ socialTypes[socialType] }}
                      </mat-option>
                    </mat-select>
                  </mat-form-field>
                  <div class="flex flex-row">
                    <mat-form-field class="grow">
                      <input
                        formControlName="url"
                        matInput
                        class="step-input"
                        type="text"
                        id="email-{{ j }}"
                        autocomplete="none"
                        appTrimValue />
                    </mat-form-field>
                    <button class="delete-block" mat-button (click)="deleteFormField(addressForm.get('socialNetworks'), j)">
                      <mat-icon class="mat-icon-delete">delete</mat-icon>
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <div class="flex flex-row justify-start items-center content-center">
              <button
                class="btn-add"
                mat-button
                (click)="addSocialsField(addressForm)"
                [disabled]="addressForm.get('socialNetworks').invalid">
                <mat-icon class="mat-icon-add">add</mat-icon>{{ 'BUTTONS.ADD_MORE_SOCIAL_NETWORK' | translate }}
              </button>
            </div>
            <div class="map">
              <app-map
                [mapId]="item"
                [settelmentFormGroup]="addressForm.get('searchGroup').get('settlement')"
                [addressFormGroup]="addressForm"
                (addressSelect)="onAddressSelect($event, addressForm)">
              </app-map>
            </div>
          </div>
        </form>
      </mat-expansion-panel>
    </mat-accordion>
    <div class="flex flex-row justify-start items-center content-center add-button">
      <button class="btn-add" mat-button (click)="addAddressGroup()" [disabled]="addressesFormArray.invalid">
        <mat-icon class="mat-icon-add">add</mat-icon>{{ 'BUTTONS.ADD_MORE_ADDRESS' | translate }}
      </button>
    </div>
  </div>
</div>
