<form [formGroup]="PositionFormGroup" class="step flex flex-col justify-between items-stretch">

  <label class="step-label">{{ 'FORMS.LABELS.FULL_TITLE' | translate }}<span class="step-required">*</span></label>
  <mat-form-field appearance="fill">
    <input matInput formControlName="fullName" class="step-input" placeholder="{{ 'FORMS.PLACEHOLDERS.ENTER_FULL_TITLE' | translate}}" />
  </mat-form-field>
  <app-validation-hint
    [validationFormControl]="PositionFormGroup.get('fullName')"
    [minCharacters]="validationConstants.INPUT_LENGTH_1"
    [maxCharacters]="validationConstants.INPUT_LENGTH_60">
  </app-validation-hint>

  <label class="step-label">{{ 'FORMS.LABELS.SHORT_TITLE' | translate }}<span class="step-required">*</span></label>
  <mat-form-field appearance="fill">
    <input matInput formControlName="shortName" class="step-input" placeholder="{{ 'FORMS.PLACEHOLDERS.ENTER_SHORT_TITLE' | translate}}" />
  </mat-form-field>
  <app-validation-hint
    [validationFormControl]="PositionFormGroup.get('shortName')"
    [minCharacters]="validationConstants.INPUT_LENGTH_1"
    [maxCharacters]="validationConstants.INPUT_LENGTH_60">
  </app-validation-hint>

  <label class="step-label">{{ 'TITLES.DESCRIPTION' | translate }}<span class="step-required">*</span></label>
  <textarea matInput formControlName="description" class="step-textarea step-textarea-short" placeholder="{{ 'FORMS.PLACEHOLDERS.ENTER_DESCRIPTION' | translate}}"></textarea>
  <app-validation-hint
    [validationFormControl]="PositionFormGroup.get('description')"
    [minCharacters]="validationConstants.INPUT_LENGTH_1"
    [maxCharacters]="validationConstants.INPUT_LENGTH_500">
  </app-validation-hint>

  <mat-checkbox class="step-label" color="primary" formControlName="forRuralAres">
    {{ 'FORMS.LABELS.FOR_RURAL_AREAS' | translate }}
  </mat-checkbox>

  <label class="step-label">{{ 'FORMS.LABELS.OPENED_IN_DEPARTMENT' | translate }}</label>
  <mat-form-field appearance="fill">
    <input matInput formControlName="openedInDepartment" class="step-input" placeholder="{{ 'FORMS.PLACEHOLDERS.ENTER_DEPARTMENT_NAME' | translate}}" />
  </mat-form-field>

  <div class="flex flex-col justify-between items-stretch">
    <div class="flex flex-row justify-between items-start">
      <label class="step-label">{{ 'FORMS.LABELS.AVAILABLE_PLACES' | translate }}<span class="step-required">*</span></label>
    </div>
    <mat-radio-group [formControl]="numOfSeatsRadioBtnControl" color="primary">
      <mat-radio-button [value]="true">{{ 'UNLIMITED' | translate }}</mat-radio-button>
      <div class="container flex flex-row justify-between items-center">
        <div class="radio-button-wrap flex flex-row justify-center items-center">
          <mat-radio-button [value]="false">
            <input
              matInput
              class="step-input price-input"
              appDigitOnly
              formControlName="numOfSeats"
              type="number"
              [min]="minSeats"
              [max]="UNLIMITED_SEATS" />
          </mat-radio-button>
        </div>
      </div>
      <app-validation-hint [validationFormControl]="numOfSeatsControl" [minNumberValue]="minSeats"></app-validation-hint>
    </mat-radio-group>
  </div>

  <label class="step-label">{{ 'FORMS.LABELS.NAME_IN_GENITIVE_CASE' | translate }}</label>
  <mat-form-field appearance="fill">
    <input matInput formControlName="nameInGenitiveCase" class="step-input" placeholder="{{ 'FORMS.PLACEHOLDERS.ENTER_NAME_IN_GENITIVE_CASE' | translate}}" />
  </mat-form-field>

  <mat-checkbox class="step-label" color="primary" formControlName="teachingPosition">
    {{ 'FORMS.LABELS.TEACHING_POSITION' | translate }}
  </mat-checkbox>

  <label class="step-label">{{ 'FORMS.LABELS.RATE' | translate }}<span class="step-required">*</span></label>
  <mat-form-field appearance="fill">
    <input matInput formControlName="rate" class="step-input" type="number" placeholder="{{ 'FORMS.PLACEHOLDERS.ENTER_RATE' | translate}}" />
  </mat-form-field>
  <app-validation-hint
    [validationFormControl]="PositionFormGroup.get('rate')"
    [minCharacters]="validationConstants.INPUT_LENGTH_1"
    [maxCharacters]="validationConstants.INPUT_LENGTH_10">
  </app-validation-hint>

  <label class="step-label">{{ 'FORMS.LABELS.TARIFF' | translate }}<span class="step-required">*</span></label>
  <mat-form-field appearance="fill">
    <input matInput formControlName="tariff" class="step-input" type="number" placeholder="{{ 'FORMS.PLACEHOLDERS.ENTER_TARIFF' | translate}}" />
  </mat-form-field>
  <app-validation-hint
    [validationFormControl]="PositionFormGroup.get('tariff')"
    [minCharacters]="validationConstants.INPUT_LENGTH_1"
    [maxCharacters]="validationConstants.INPUT_LENGTH_10">
  </app-validation-hint>

  <label class="step-label">{{ 'FORMS.LABELS.TYPE_BY_CLASSIFIER' | translate }}</label>
  <mat-form-field appearance="fill">
    <input matInput formControlName="typeByClassifier" class="step-input" placeholder="{{ 'FORMS.PLACEHOLDERS.ENTER_TYPE_BY_CLASSIFIER' | translate}}" />
  </mat-form-field>
</form>
